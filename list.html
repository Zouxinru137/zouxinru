<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>zou 视频 - 频道</title>
  <link rel="stylesheet" href="fonts/zou-iconfont.css">
  <link rel="stylesheet" href="css/zouxinru.css">
</head>
<body>
  <div class="zou-page">
    <!-- 页头 -->
    <header class="zou-header zou-header--solid">
      <a class="zou-header__logo" href="index.html"><span class="zou-icon zou-icon-play"></span>zou视频</a>
      <a class="zou-header__search" href="search.html">
        <span class="zou-icon zou-icon-search"></span>搜索影片、演员、片单
      </a>
      <a href="profile.html"><img class="zou-header__avatar" src="images/avatar.png" alt="我的"></a>
    </header>

    <div style="height: var(--zou-header-h)"></div>

    <!-- 分类 tab（选项卡效果） -->
    <div class="zou-tabs" id="zouCatTabs"></div>

    <!-- 列表卡片 -->
    <div class="zou-grid" id="zouListGrid"></div>
    <div class="zou-loading" id="zouListLoading"><span class="zou-icon zou-icon-play"></span> 加载中...</div>
    <div class="zou-empty" id="zouListEmpty" style="display:none">
      <span class="zou-icon zou-icon-search"></span>该分类暂无内容
    </div>

    <!-- 分页 -->
    <div class="zou-pagination" id="zouPager"></div>

    <footer class="zou-footer">
      zou视频 · 《高级网页设计I》三级项目<br>
      制作：邹欣茹 24002120217 · 2026年11月
    </footer>
  </div>

  <!-- 底部导航 -->
  <nav class="zou-tabbar">
    <a class="zou-tabbar__item" href="index.html"><span class="zou-icon zou-icon-home"></span>首页</a>
    <a class="zou-tabbar__item zou-tabbar__item--active" href="list.html"><span class="zou-icon zou-icon-grid"></span>频道</a>
    <a class="zou-tabbar__item" href="rank.html"><span class="zou-icon zou-icon-fire"></span>排行</a>
    <a class="zou-tabbar__item" href="profile.html"><span class="zou-icon zou-icon-user"></span>我的</a>
  </nav>

  <script src="js/zou-common.js"></script>
  <script src="js/zou-list.js"></script>
</body>
</html>

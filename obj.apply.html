<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
        <script>
        var a=6, b=1;
        console.log(a=+b);
        console.log(a++,++b); // 先输出a的值,再自增1,输出b自增后的值
        console.log(a-b>0?a:b); // 如果a-b>0,则输出a,否则输出b
        console.log(true&&false,true||false,!true); // 逻辑运算符
        var str="hello world",num=123,bl=true,obj={name:"张三",age:18},ud,kong=null;
        console.log(typeof str,typeof num,typeof bl,typeof obj,typeof ud,typeof kong);
        console.log(0.1+0.2==0.3) //JS不能用==或者===（恒等）来判定浮点数是否相等，因为浮点数不能用二进制精确存储
        // 数据类型转换:+号的时候将数字转换为字符串,-只能用于数值运算
        console.log(1+"1","1"-1,"11"+1-1); 
        console.log("niziwei"-1); //NaN:not a number
        console.log(isNaN("niziwei"-1));
        console.log(NaN==NaN,null==null);
        // isNaN()函数用于检查一个值是否是非数字值，如果是非数字值则返回true，否则返回false
        console.log(parseInt(123.79)) // parseInt()函数用于将字符串解析为整数，忽略小数点后的部分
        // 如果想判断一个数值是不是整数的方法有什么？
        var num = 123.79;
        console.log(num==parseInt(num)); // 取余数判断是否为整数
        console.log(parseInt(100,16)); // parseInt()函数的第二个参数表示进制，16进制转换为10进制
        // 1-100求和
         var sum = 0;
         for(var i=1;i<=100;i++){
            sum+=i;
         }
         // 数7，（7的倍数，最大值到99，个位数是7，十位数是7，不显示数字）
         for(var i=1;i<=99;i++){
            if(i%7==0 || i%10==7 || parseInt(i/10)==7){
               document.write("<div></div>");
            }
        else{
            document.write("<div>"+i+"</div>");
         }
        }
    </script>
</body>
</html>

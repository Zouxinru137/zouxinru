<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>抓小球游戏|函数的三个方法的应用</title>
    <style>
        body{
            overflow: hidden;
            background: #f0f0f0;
            font-size:24px;
        }
        #info{
            padding:16px;
            background: lightblue;
            color: white;
        }
        .ball{
            width: 50px;
            height: 50px;
            background: lightpink;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div id="info">当前分数：<span id="score">0</span></div>
    <div class="ball" id="ball"></div>
    <script>
    // const是常量指的是变量的引用地址不能变，不是对象里面的数据不能改。
    const game = {
        score: 0,
        ballDom: document.getElementById('ball'),
        width:50,
        height:50
    };// 需要什么函数：小球移动、小球点击、分数更新、小球放置、窗口大小
    function moveBall() {
        // 保证小球在屏幕内
        const maxX = window.innerWidth - game.width;
        const maxY = window.innerHeight - game.height;
        // 小球随机位置是0-窗口宽度取整
        const randomX = Math.floor(Math.random() * maxX);
        const randomY = Math.floor(Math.random() * maxY);
        // 移动小球
        game.ballDom.style.left = randomX + 'px';
        game.ballDom.style.top = randomY + 'px';
    }
    </script>
</body>
</html>

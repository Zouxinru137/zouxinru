<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>zou 视频 - 注册</title>
  <link rel="stylesheet" href="fonts/zou-iconfont.css">
  <link rel="stylesheet" href="css/zouxinru.css">
</head>
<body>
  <div class="zou-auth">
    <a class="zou-header__logo" href="index.html" style="position:relative;z-index:2"><span class="zou-icon zou-icon-play"></span>zou视频</a>
    <div class="zou-auth__title">创建账号</div>
    <div class="zou-auth__sub">注册即享收藏、评论、观看历史同步功能</div>

    <div class="zou-form-item">
      <label class="zou-form-item__label">用户名（字母开头，4~16 位）</label>
      <div class="zou-input-wrap">
        <span class="zou-icon zou-icon-user"></span>
        <input class="zou-input" id="zouRegName" placeholder="如 zoufan" maxlength="16">
      </div>
      <div class="zou-form-err" id="zouRegNameErr"></div>
    </div>

    <div class="zou-form-item">
      <label class="zou-form-item__label">昵称（选填）</label>
      <div class="zou-input-wrap">
        <span class="zou-icon zou-icon-heart"></span>
        <input class="zou-input" id="zouRegNick" placeholder="给自己取个昵称" maxlength="12">
      </div>
      <div class="zou-form-err" id="zouRegNickErr"></div>
    </div>

    <div class="zou-form-item">
      <label class="zou-form-item__label">密码（至少 6 位）</label>
      <div class="zou-input-wrap">
        <span class="zou-icon zou-icon-star"></span>
        <input class="zou-input" id="zouRegPwd" type="password" placeholder="设置登录密码" maxlength="20">
      </div>
      <div class="zou-form-err" id="zouRegPwdErr"></div>
    </div>

    <div class="zou-form-item">
      <label class="zou-form-item__label">确认密码</label>
      <div class="zou-input-wrap">
        <span class="zou-icon zou-icon-star"></span>
        <input class="zou-input" id="zouRegPwd2" type="password" placeholder="再次输入密码" maxlength="20">
      </div>
      <div class="zou-form-err" id="zouRegPwd2Err"></div>
    </div>

    <button class="zou-btn zou-btn--block" id="zouRegBtn">注 册</button>
    <div class="zou-auth__switch">已有账号？<a href="login.html">直接登录</a></div>
  </div>

  <script src="js/zou-common.js"></script>
  <script src="js/zou-register.js"></script>
</body>
</html>

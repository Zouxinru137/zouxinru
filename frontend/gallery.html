  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图文列表 | Zouxinru</title>
  <link rel="stylesheet" href="css/zxr_gallery.css">

<body>
  <canvas id="zxr_canvas_bg" aria-hidden="true"></canvas>

  <div class="zxr_page_wrap">
    <header class="zxr_header">
      <div class="zxr_logo">拾光集市</div>
      <nav class="zxr_top_nav">

<html lang="zh-CN">

<body>
  <canvas id="zxr_canvas_bg" aria-hidden="true"></canvas>

  <div class="zxr_page_wrap">

      <div class="zxr_logo">拾光集市</div>
      <nav class="zxr_top_nav">
        <a href="index.html" class="zxr_nav_link">首页</a>
        <a href="database.html" class="zxr_nav_link zxr_nav_active">数据库</a>

    <section class="zxr_db_card">
      <h1 class="zxr_db_title">数据库连接测试</h1>

      <form id="zxr_db_form" class="zxr_db_form">
        <label class="zxr_form_label">
          <span class="zxr_label_text">用户名</span>
          <input type="text" id="zxr_db_username" class="zxr_form_input" value="root" autocomplete="username">

        <label class="zxr_form_label">
          <span class="zxr_label_text">密码</span>
          <input type="password" id="zxr_db_password" class="zxr_form_input" value="Zxr66666617" autocomplete="current-password">
        </label>
        <button type="submit" id="zxr_db_submit" class="zxr_form_btn">连接数据库</button>
      </form>

      <div id="zxr_db_message" class="zxr_db_message"></div>
    </section>

    <footer class="zxr_footer">

<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>知识库管理（RAG）</title>
  <link rel="stylesheet" href="css/zxr_kb.css">
</head>
<body>
  <canvas id="zxr_canvas_bg" aria-hidden="true"></canvas>

  <div class="zxr_page_wrap">
    <header class="zxr_header">
      <div class="zxr_logo">拾光集市</div>
      <nav class="zxr_top_nav">
        <a href="index.html" class="zxr_nav_link">首页</a>
        <a href="database.html" class="zxr_nav_link">数据库</a>
        <a href="news.html" class="zxr_nav_link">科技新闻</a>
        <a href="gallery.html" class="zxr_nav_link">图文列表</a>
        <a href="ai-chat.html" class="zxr_nav_link">在线客服</a>
        <a href="kb.html" class="zxr_nav_link zxr_nav_active">知识库</a>
      </nav>
    </header>

    <section class="zxr_kb_section">
      <h1 class="zxr_kb_title">知识库管理（RAG）</h1>
      <p class="zxr_kb_subtitle">上传本地文件（doc / docx / ppt / pptx / pdf / txt，≤10MB）构建专属智能客服问答</p>

      <!-- 上传模块 -->
      <div id="zxr_drop_zone" class="zxr_drop_zone">
        <div class="zxr_drop_icon">⇪</div>
        <p class="zxr_drop_text">点击选择 或 将文件拖拽到此处上传</p>
        <p class="zxr_drop_hint">支持 .doc .docx .ppt .pptx .pdf .txt</p>
        <input id="zxr_file_input" type="file" accept=".doc,.docx,.ppt,.pptx,.pdf,.txt" hidden>
      </div>
      <div id="zxr_upload_status" class="zxr_status"></div>

      <!-- 知识库文件列表 -->
      <h2 class="zxr_sub_title">知识库文件</h2>
      <div id="zxr_file_list" class="zxr_file_list"></div>

      <!-- 基于知识库的问答 -->
      <h2 class="zxr_sub_title">知识库问答</h2>
      <div id="zxr_chat_box" class="zxr_chat_box"></div>
      <div class="zxr_input_row">
        <input id="zxr_input" class="zxr_kb_input" type="text" maxlength="200" placeholder="例如：烤鸭多少钱？平台的退款流程是什么？">
        <button id="zxr_ask_btn" class="zxr_ask_btn" type="button">提问</button>
      </div>
      <div id="zxr_ask_status" class="zxr_status"></div>
    </section>

    <footer class="zxr_footer">
      <span>拾光集市 · RAG 知识库</span>
      <span>姓名：Zouxinru | 学号：24002120217</span>
    </footer>
  </div>

  <script src="js/zxr_index.js"></script>
  <script src="js/zxr_kb.js"></script>
</body>
</html>

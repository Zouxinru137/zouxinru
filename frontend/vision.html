<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图像识别</title>
  <link rel="stylesheet" href="css/zxr_vision.css">
</head>
<body>
  <canvas id="zxr_canvas_bg" aria-hidden="true"></canvas>

  <div class="zxr_page_wrap">
    <header class="zxr_header">
      <div class="zxr_logo">拾光集市</div>
      <nav class="zxr_top_nav">
        <a href="index.html" class="zxr_nav_link">首页</a>
        <a href="database.html" class="zxr_nav_link">数据库</a>
        <a href="news.html" class="zxr_nav_link">科技新闻</a>
        <a href="gallery.html" class="zxr_nav_link">图文列表</a>
        <a href="ai-chat.html" class="zxr_nav_link">在线客服</a>
        <a href="kb.html" class="zxr_nav_link">知识库</a>
        <a href="vision.html" class="zxr_nav_link zxr_nav_active">图像识别</a>
      </nav>
    </header>

    <section class="zxr_vision_section">
      <h1 class="zxr_vision_title">图像识别</h1>
      <p class="zxr_vision_subtitle">上传图片（jpg / png / webp / gif，≤8MB），AI 视觉模型自动生成中文描述</p>

      <div id="zxr_drop_zone" class="zxr_drop_zone">
        <div class="zxr_drop_icon">◫</div>
        <p class="zxr_drop_text">点击选择 或 将图片拖拽到此处</p>
        <p class="zxr_drop_hint">jpg / png / webp / gif，≤8MB</p>
        <input id="zxr_file_input" type="file" accept=".jpg,.jpeg,.png,.webp,.gif" hidden>
      </div>

      <div id="zxr_preview_wrap" class="zxr_preview_wrap" hidden>
        <img id="zxr_preview_img" class="zxr_preview_img" alt="预览图">
        <div class="zxr_preview_side">
          <div id="zxr_status" class="zxr_status"></div>
          <button id="zxr_recognize_btn" class="zxr_recognize_btn" type="button">开始识别</button>
          <button id="zxr_reset_btn" class="zxr_reset_btn" type="button">换一张</button>
        </div>
      </div>

      <div id="zxr_result_card" class="zxr_result_card" hidden>
        <h2 class="zxr_result_title">识别结果</h2>
        <p id="zxr_result_text" class="zxr_result_text"></p>
        <p id="zxr_result_meta" class="zxr_result_meta"></p>
      </div>
    </section>

    <footer class="zxr_footer">
      <span>拾光集市 · 图像识别</span>
      <span>姓名：Zouxinru | 学号：24002120217</span>
    </footer>
  </div>

  <script src="js/zxr_index.js"></script>
  <script src="js/zxr_vision.js"></script>
</body>
</html>
